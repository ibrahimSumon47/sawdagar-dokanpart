name: Release guest holds

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Release expired guest stock holds
    runs-on: ubuntu-latest
    steps:
      - name: Call the release route
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${SITE_URL}/api/checkout/release-holds"
