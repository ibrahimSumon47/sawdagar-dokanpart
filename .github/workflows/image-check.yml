name: Image check

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clip:
    name: CLIP relevance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The score run reports; the publish gate is scripts/ci/check-images.ts,
    # which refuses a manifest with an unrecorded or failing review.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU torch, CLIP and OpenCV
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install transformers pillow opencv-python-headless
      - name: Score every product photo
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLIP_MODEL: openai/clip-vit-large-patch14
        run: |
          python scripts/images/clip-check.py \
            packages/seed/images/manifest.json \
            packages/seed/images/clip-thresholds.json \
            packages/seed/images/keywords.json \
            clip-scores.json
      - uses: actions/upload-artifact@v4
        with:
          name: clip-scores
          path: clip-scores.json
