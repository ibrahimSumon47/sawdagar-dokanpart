name: Image check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clip:
    name: CLIP relevance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU torch and CLIP
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install transformers pillow
      - name: Score every product photo
        env:
          CLOUDINARY_CLOUD_NAME: ${{ vars.CLOUDINARY_CLOUD_NAME }}
        run: |
          python scripts/images/clip-check.py \
            packages/seed/images/manifest.json \
            packages/seed/images/clip-thresholds.json \
            packages/seed/images/keywords.json \
            clip-scores.json
      - uses: actions/upload-artifact@v4
        with:
          name: clip-scores
          path: clip-scores.json
