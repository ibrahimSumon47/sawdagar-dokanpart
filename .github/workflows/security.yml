name: Security

# Dependency audit and secret scan. Runs on every push and pull request so a
# leaked key or a new high-severity advisory is caught before it reaches main.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails on high or critical advisories. Advisories that remain in
      # dev-only Lighthouse tooling are listed in docs/reports/security.md.
      - run: pnpm audit --audit-level=high --prod

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # gitleaks is MIT-licensed and free for this use. The action needs no
      # licence key for a personal repository.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
