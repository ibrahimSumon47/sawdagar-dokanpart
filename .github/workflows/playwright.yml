name: Playwright

# Disabled while the Vercel team is paused; re-enable with
#   gh workflow enable "Playwright"
# Point this at a preview deployment or a locally built server. Do not run a
# loop against the production origin.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: HTTPS preview URL to test (not production)
        required: true
        default: ''

permissions:
  contents: read

jobs:
  storefront:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Require a non-production target
        run: |
          if [ -z "${{ inputs.base_url }}" ]; then
            echo "Enter a preview deployment URL; production loops are disabled." >&2
            exit 1
          fi
      - run: pnpm exec playwright test
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.base_url }}
          DEMO_ACCOUNT_PASSWORD: ${{ secrets.DEMO_ACCOUNT_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 30
