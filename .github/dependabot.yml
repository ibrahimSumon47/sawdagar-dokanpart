version: 2

# Version updates are handled in a manual monthly review. The pnpm audit job in
# security.yml still fails CI on a high or critical advisory, and GitHub security
# alerts stay on. Both update entries keep their schedule so Dependabot remains
# valid, but a limit of zero stops it from opening branches or pull requests.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
